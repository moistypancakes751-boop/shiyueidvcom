<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>成员介绍模板 | 誓约俱乐部</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/titan-favicon.png?v=20260602-tab1" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=20260602-tab1" />
    <style>
      :root {
        --paper: #f7f7f8;
        --ink: #272932;
        --muted: #858a94;
        --line: #aeb5bf;
        --blue: #6571ff;
        --rose: #c99cac;
        --cyan: #8bb8c1;
        --dark: #252832;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background:
          radial-gradient(circle at 14% 18%, rgba(201, 156, 172, 0.14), transparent 28%),
          radial-gradient(circle at 84% 42%, rgba(139, 184, 193, 0.16), transparent 32%),
          linear-gradient(180deg, #ffffff, #e9ecf2);
        color: var(--ink);
        font-family:
          "PingFang SC",
          "Microsoft YaHei",
          system-ui,
          -apple-system,
          sans-serif;
      }

      .template {
        position: relative;
        overflow: hidden;
        width: 1200px;
        height: 800px;
        border: 1px solid rgba(117, 124, 136, 0.58);
        background:
          linear-gradient(105deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.98) 46%, rgba(255, 255, 255, 0.58)),
          var(--paper);
        box-shadow: 0 34px 110px rgba(30, 34, 44, 0.22);
      }

      .template::before {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(174, 181, 191, 0.24) 1px, transparent 1px),
          linear-gradient(90deg, rgba(174, 181, 191, 0.18) 1px, transparent 1px);
        background-size: 42px 42px;
        content: "";
        opacity: 0.55;
      }

      .template::after {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.94) 54%, rgba(255, 255, 255, 0.4)),
          url("./assets/anime-bg-v2.png") left center / cover no-repeat;
        content: "";
        opacity: 0.36;
        filter: saturate(0.6) contrast(0.94);
      }

      .scanline,
      .top-band,
      .brand,
      .dossier,
      .portrait,
      .avatar-mini,
      .stamp,
      .bottom-title,
      .barcode,
      .ticket,
      .cube {
        position: absolute;
        z-index: 2;
      }

      .scanline {
        z-index: 1;
        inset: 0;
        background:
          repeating-linear-gradient(0deg, rgba(37, 40, 50, 0.04) 0 1px, transparent 1px 7px),
          linear-gradient(115deg, transparent 0 37%, rgba(255, 255, 255, 0.7) 37% 38%, transparent 38%);
        opacity: 0.52;
        pointer-events: none;
      }

      .top-band {
        z-index: 3;
        top: -34px;
        left: 78px;
        width: 620px;
        height: 86px;
        background:
          repeating-linear-gradient(135deg, rgba(37, 40, 50, 0.96) 0 18px, rgba(255, 255, 255, 0.82) 18px 28px),
          var(--dark);
        opacity: 0.88;
        transform: rotate(-4deg);
        box-shadow: 0 18px 40px rgba(30, 34, 44, 0.18);
      }

      .brand {
        top: 44px;
        left: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--ink);
        font-weight: 950;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.74);
        color: var(--rose);
        font-size: 13px;
        box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.72);
      }

      .brand-name {
        font-size: 22px;
        letter-spacing: 0;
      }

      .brand-sub {
        color: var(--muted);
        font-size: 11px;
        font-weight: 950;
        letter-spacing: 0;
      }

      .dossier {
        top: 112px;
        left: 64px;
        width: 615px;
        min-height: 580px;
        border: 2px solid rgba(126, 135, 148, 0.72);
        padding: 32px 34px 28px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(238, 241, 246, 0.44)),
          rgba(255, 255, 255, 0.58);
        box-shadow: 0 28px 78px rgba(30, 34, 44, 0.16);
        backdrop-filter: blur(14px);
      }

      .dossier::before {
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(174, 181, 191, 0.55);
        content: "";
        pointer-events: none;
      }

      .dossier::after {
        position: absolute;
        top: -30px;
        right: 20px;
        width: 250px;
        height: 250px;
        border: 1px solid rgba(126, 135, 148, 0.26);
        border-radius: 50%;
        content: "";
        pointer-events: none;
      }

      .eyebrow {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .eyebrow::after {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--line), transparent);
        content: "";
      }

      .name-row {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 126px;
        gap: 18px;
        align-items: end;
        margin-bottom: 16px;
      }

      .name {
        color: transparent;
        -webkit-text-stroke: 1.7px var(--ink);
        filter: drop-shadow(0 8px 14px rgba(30, 34, 44, 0.16));
        font-size: 76px;
        line-height: 0.92;
        font-weight: 950;
      }

      .id-box {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.58);
        color: var(--ink);
        font-size: 12px;
        font-weight: 950;
        text-align: center;
      }

      .line-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
        margin-bottom: 13px;
      }

      .field,
      .wide-field {
        min-height: 44px;
        border: 1px solid rgba(174, 181, 191, 0.74);
        border-radius: 14px;
        padding: 11px 14px;
        background: rgba(255, 255, 255, 0.48);
        color: var(--ink);
        font-size: 17px;
        font-weight: 950;
      }

      .field span,
      .wide-field span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 950;
      }

      .blank {
        display: inline-block;
        width: 62%;
        border-bottom: 1.5px solid rgba(39, 41, 50, 0.62);
        transform: translateY(-3px);
      }

      .role-strip {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 18px;
      }

      .role-strip .blank {
        width: 58%;
      }

      .section-label {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0 12px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 950;
      }

      .section-label::before {
        width: 42px;
        height: 3px;
        background: linear-gradient(90deg, var(--rose), var(--cyan), var(--blue));
        content: "";
      }

      .notes {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 11px;
      }

      .note-line {
        display: grid;
        grid-template-columns: 104px 1fr;
        gap: 12px;
        align-items: center;
        color: var(--ink);
        font-size: 17px;
        font-weight: 950;
      }

      .note-line b {
        white-space: nowrap;
      }

      .note-line span {
        height: 20px;
        border-bottom: 1.5px solid rgba(39, 41, 50, 0.6);
      }

      .signature {
        position: relative;
        z-index: 1;
        margin-top: 18px;
        border: 1px solid rgba(174, 181, 191, 0.62);
        border-radius: 18px;
        padding: 13px 16px;
        background: rgba(255, 255, 255, 0.46);
        color: var(--muted);
        font-size: 13px;
        font-weight: 950;
      }

      .signature span {
        display: inline-block;
        width: 72%;
        border-bottom: 1.5px solid rgba(39, 41, 50, 0.5);
        transform: translateY(-3px);
      }

      .portrait {
        top: 92px;
        right: 62px;
        width: 398px;
        height: 610px;
        border: 2px solid rgba(126, 135, 148, 0.76);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.58), rgba(238, 241, 246, 0.22)),
          rgba(255, 255, 255, 0.36);
        box-shadow: 0 30px 90px rgba(30, 34, 44, 0.18);
        backdrop-filter: blur(14px);
        transform: rotate(1.6deg);
      }

      .portrait::before {
        position: absolute;
        z-index: 3;
        top: -18px;
        left: 74px;
        width: 230px;
        height: 34px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.72), rgba(174, 181, 191, 0.34), rgba(255, 255, 255, 0.72));
        box-shadow: 0 10px 22px rgba(30, 34, 44, 0.1);
        content: "";
        transform: rotate(-2deg);
      }

      .portrait::after {
        position: absolute;
        inset: 26px;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(39, 41, 50, 0.38);
        background:
          linear-gradient(rgba(174, 181, 191, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(174, 181, 191, 0.13) 1px, transparent 1px);
        background-size: 28px 28px;
        color: rgba(39, 41, 50, 0.5);
        content: "头像 / 立绘";
        font-size: 38px;
        font-weight: 950;
      }

      .avatar-mini {
        right: 345px;
        bottom: 54px;
        width: 170px;
        height: 126px;
        border: 2px solid rgba(126, 135, 148, 0.7);
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 18px 46px rgba(30, 34, 44, 0.14);
        transform: rotate(-5deg);
      }

      .avatar-mini::before {
        position: absolute;
        inset: 14px;
        display: grid;
        place-items: center;
        border: 1px dashed rgba(39, 41, 50, 0.36);
        color: rgba(39, 41, 50, 0.54);
        content: "头像";
        font-size: 20px;
        font-weight: 950;
      }

      .barcode {
        right: 72px;
        top: 38px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 950;
      }

      .barcode::before {
        width: 150px;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--cyan), var(--blue));
        content: "";
      }

      .ticket {
        right: 78px;
        bottom: 94px;
        display: grid;
        grid-template-columns: repeat(3, 34px);
        gap: 4px;
      }

      .ticket span {
        border: 1px solid rgba(39, 41, 50, 0.42);
        padding: 3px 0;
        background: rgba(255, 255, 255, 0.58);
        color: rgba(39, 41, 50, 0.72);
        font-size: 8px;
        font-weight: 950;
        text-align: center;
      }

      .cube {
        right: 34px;
        bottom: 160px;
        width: 78px;
        height: 78px;
        border: 1px solid rgba(39, 41, 50, 0.44);
        background:
          linear-gradient(135deg, rgba(39, 41, 50, 0.18), rgba(255, 255, 255, 0.4));
        box-shadow: 0 18px 38px rgba(30, 34, 44, 0.14);
        transform: rotate(16deg);
      }

      .stamp {
        right: 74px;
        bottom: 45px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        padding: 10px 18px;
        background: rgba(37, 40, 50, 0.92);
        color: white;
        font-size: 12px;
        font-weight: 950;
      }

      .bottom-title {
        left: 62px;
        bottom: 28px;
        color: var(--ink);
        font-size: 58px;
        font-weight: 950;
        letter-spacing: 0;
      }

      .bottom-title span {
        color: var(--muted);
        font-size: 17px;
        font-weight: 900;
      }

      @media print {
        body {
          display: block;
          background: white;
        }

        .template {
          width: 1200px;
          height: 800px;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="template" aria-label="誓约俱乐部成员介绍模板">
      <div class="scanline"></div>
      <div class="top-band"></div>
      <div class="brand">
        <span class="brand-mark">SY</span>
        <div>
          <div class="brand-name">誓约俱乐部成员档案</div>
          <div class="brand-sub">SHIYUE CLUB / IDENTITY V SERVICE</div>
        </div>
      </div>
      <div class="barcode">PROFILE / 2026</div>

      <section class="dossier">
        <p class="eyebrow">MEMBER PROFILE</p>
        <div class="name-row">
          <div class="name">成员昵称</div>
          <div class="id-box">IDV / SY</div>
        </div>

        <div class="line-grid">
          <div class="field"><span>性别：</span><i class="blank"></i></div>
          <div class="field"><span>年龄：</span><i class="blank"></i></div>
          <div class="field"><span>声线：</span><i class="blank"></i></div>
          <div class="field"><span>地区：</span><i class="blank"></i></div>
        </div>

        <div class="role-strip">
          <div class="wide-field"><span>求生者：</span><i class="blank"></i></div>
          <div class="wide-field"><span>监管者：</span><i class="blank"></i></div>
        </div>

        <div class="section-label">CUSTOM INFO</div>
        <div class="notes">
          <div class="note-line"><b>擅长：</b><span></span></div>
          <div class="note-line"><b>可接：</b><span></span></div>
          <div class="note-line"><b>在线时间：</b><span></span></div>
          <div class="note-line"><b>自我介绍：</b><span></span></div>
          <div class="note-line"><b>备注：</b><span></span></div>
        </div>

        <div class="signature">个性签名：<span></span></div>
      </section>

      <aside class="portrait"></aside>
      <div class="avatar-mini"></div>
      <div class="ticket"><span>SY</span><span>IDV</span><span>VIP</span><span>PLAY</span><span>DUO</span><span>RANK</span></div>
      <div class="cube"></div>
      <div class="stamp">@SY CLUB</div>
      <div class="bottom-title">Night Contract <span>/ Member Card Template</span></div>
    </main>
  </body>
</html>
