<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord 登录 | 誓约俱乐部</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="tag">SY DISCORD</p>
        <h1>正在连接 Discord</h1>
        <p id="auth-status">请稍等，正在读取你的 Discord 资料。</p>
        <a class="button primary" href="./index.html#member">返回会员中心</a>
      </section>
    </main>

    <script>
      const statusEl = document.querySelector("#auth-status");
      const params = new URLSearchParams(window.location.hash.slice(1));
      const token = params.get("access_token");

      async function finishDiscordLogin() {
        if (!token) {
          statusEl.textContent = "没有收到 Discord 登录凭证。请返回首页重新点击登录。";
          return;
        }

        try {
          const response = await fetch("https://discord.com/api/users/@me", {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!response.ok) throw new Error("Discord API 请求失败");

          const profile = await response.json();
          localStorage.setItem(
            "syDiscordProfile",
            JSON.stringify({
              id: profile.id,
              username: profile.global_name || profile.username,
              rawUsername: profile.username,
              avatar: profile.avatar,
              connectedAt: new Date().toISOString(),
            }),
          );
          statusEl.textContent = "Discord 已连接，正在返回会员中心。";
          window.setTimeout(() => {
            window.location.href = "./index.html#member";
          }, 900);
        } catch (error) {
          statusEl.textContent = "Discord 登录读取失败。请确认 OAuth Redirect URL 已在 Developer Portal 添加。";
        }
      }

      finishDiscordLogin();
    </script>
  </body>
</html>
