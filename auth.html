<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord 登录 | 誓约俱乐部</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="tag">SY DISCORD</p>
        <h1>正在连接 Discord</h1>
        <p id="auth-status">请稍等，正在读取你的 Discord 资料。</p>
        <a class="button primary" href="./index.html#member">返回会员中心</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=20260528-1840"></script>
    <script>
      const statusEl = document.querySelector("#auth-status");
      const supabaseClient =
        window.supabase && window.SY_SUPABASE_URL && window.SY_SUPABASE_ANON_KEY
          ? window.supabase.createClient(window.SY_SUPABASE_URL, window.SY_SUPABASE_ANON_KEY)
          : null;

      const getDiscordProfile = (user) => {
        const identity = user?.identities?.find((item) => item.provider === "discord") || user?.identities?.[0];
        const meta = user?.user_metadata || {};
        const discordId = meta.provider_id || meta.sub || identity?.identity_data?.sub || identity?.id || user?.id;

        return {
          id: discordId,
          userId: user?.id,
          username: meta.full_name || meta.name || meta.preferred_username || meta.user_name || "Discord 用户",
          rawUsername: meta.preferred_username || meta.user_name || meta.name || "",
          avatar: meta.avatar_url || "",
          connectedAt: new Date().toISOString(),
        };
      };

      const syncProfile = async (profile) => {
        try {
          if (!supabaseClient || !profile?.userId) return;
          await supabaseClient.from("profiles").upsert({
            id: profile.userId,
            discord_id: profile.id,
            username: profile.username,
            avatar_url: profile.avatar,
            updated_at: new Date().toISOString(),
          });
        } catch {
          // The site can still log in before the database tables are created.
        }
      };

      async function finishDiscordLogin() {
        if (!supabaseClient) {
          statusEl.textContent = "Supabase 配置未加载，请确认 supabase-config.js 已上传。";
          return;
        }

        try {
          const code = new URLSearchParams(window.location.search).get("code");
          if (code) await supabaseClient.auth.exchangeCodeForSession(code);

          const { data, error } = await supabaseClient.auth.getSession();
          if (error) throw error;
          if (!data.session?.user) {
            statusEl.textContent = "没有收到 Discord 登录凭证。请返回首页重新点击登录。";
            return;
          }

          const profile = getDiscordProfile(data.session.user);
          localStorage.setItem("syDiscordProfile", JSON.stringify(profile));
          await syncProfile(profile);
          statusEl.textContent = "Discord 已连接，正在返回会员中心。";
          window.setTimeout(() => {
            window.location.href = "./index.html#member";
          }, 900);
        } catch (error) {
          statusEl.textContent = "Discord 登录读取失败。请确认 Supabase 和 Discord 的 Redirect URL 已配置。";
        }
      }

      finishDiscordLogin();
    </script>
  </body>
</html>
