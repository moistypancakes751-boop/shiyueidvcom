<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord 登录 | 誓约俱乐部</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/titan-favicon.png?v=20260602-tab1" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=20260602-tab1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="tag">SY DISCORD</p>
        <h1>正在连接 Discord</h1>
        <p id="auth-status">请稍等，正在读取你的 Discord 资料。</p>
        <a class="button primary" href="./index.html#member">返回会员中心</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=20260528-1840"></script>
    <script>
      const statusEl = document.querySelector("#auth-status");
      const redirectTo = `${window.location.origin}/auth.html`;
      const discordScopes = "identify email guilds guilds.members.read connections";
      const shiyueGuildId = "1498434492723888257";
      const supabaseClient =
        window.supabase && window.SY_SUPABASE_URL && window.SY_SUPABASE_ANON_KEY
          ? window.supabase.createClient(window.SY_SUPABASE_URL, window.SY_SUPABASE_ANON_KEY, {
              auth: {
                detectSessionInUrl: true,
                flowType: "pkce",
              },
            })
          : null;

      const getDiscordProfile = (user) => {
        const identity = user?.identities?.find((item) => item.provider === "discord") || user?.identities?.[0];
        const meta = user?.user_metadata || {};
        const discordId = meta.provider_id || meta.sub || identity?.identity_data?.sub || identity?.id || user?.id;

        return {
          id: discordId,
          userId: user?.id,
          username: meta.full_name || meta.name || meta.preferred_username || meta.user_name || "Discord 用户",
          rawUsername: meta.preferred_username || meta.user_name || meta.name || "",
          avatar: meta.avatar_url || "",
          connectedAt: new Date().toISOString(),
        };
      };

      const discordGet = async (path, token, errors) => {
        if (!token) return null;
        try {
          const response = await fetch(`https://discord.com/api/v10${path}`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
          if (!response.ok) {
            errors.push({ path, status: response.status });
            return null;
          }
          return response.json();
        } catch (error) {
          errors.push({ path, error: error?.name || "fetch_failed" });
          return null;
        }
      };

      const summarizeGuild = (guild) => ({
        id: guild.id,
        name: guild.name,
        owner: Boolean(guild.owner),
        permissions: guild.permissions || "",
        features: Array.isArray(guild.features) ? guild.features : [],
        approximate_member_count: guild.approximate_member_count ?? null,
        approximate_presence_count: guild.approximate_presence_count ?? null,
      });

      const summarizeConnection = (connection) => ({
        id: connection.id,
        name: connection.name,
        type: connection.type,
        verified: Boolean(connection.verified),
        visibility: connection.visibility ?? null,
      });

      const summarizeMember = (member) => {
        if (!member) return null;
        return {
          nick: member.nick || "",
          avatar: member.avatar || "",
          roles: Array.isArray(member.roles) ? member.roles : [],
          joined_at: member.joined_at || null,
          premium_since: member.premium_since || null,
          pending: Boolean(member.pending),
          communication_disabled_until: member.communication_disabled_until || null,
        };
      };

      const collectDiscordSecuritySnapshot = async (token) => {
        if (!token) {
          return { collected_at: new Date().toISOString(), scopes: discordScopes, error: "missing_provider_token" };
        }

        const endpointErrors = [];
        const [user, guilds, connections, shiyueMember] = await Promise.all([
          discordGet("/users/@me", token, endpointErrors),
          discordGet("/users/@me/guilds?with_counts=true", token, endpointErrors),
          discordGet("/users/@me/connections", token, endpointErrors),
          discordGet(`/users/@me/guilds/${shiyueGuildId}/member`, token, endpointErrors),
        ]);

        const guildList = Array.isArray(guilds) ? guilds.map(summarizeGuild) : [];
        const connectionList = Array.isArray(connections) ? connections.map(summarizeConnection) : [];
        return {
          collected_at: new Date().toISOString(),
          scopes: discordScopes,
          provider_token_present: true,
          endpoint_errors: endpointErrors,
          user: user
            ? {
                id: user.id,
                username: user.username,
                global_name: user.global_name || "",
                discriminator: user.discriminator || "",
                avatar: user.avatar || "",
                banner: user.banner || "",
                accent_color: user.accent_color ?? null,
                locale: user.locale || "",
                mfa_enabled: Boolean(user.mfa_enabled),
                verified: Boolean(user.verified),
                email: user.email || "",
                flags: user.flags ?? null,
                public_flags: user.public_flags ?? null,
                premium_type: user.premium_type ?? null,
                primary_guild: user.primary_guild || null,
              }
            : null,
          guilds: guildList,
          guild_count: guildList.length,
          connections: connectionList,
          connection_count: connectionList.length,
          shiyue_member: summarizeMember(shiyueMember),
        };
      };

      const syncProfile = async (profile, securitySnapshot) => {
        if (!supabaseClient || !profile?.userId) {
          throw new Error("Supabase client or user id is missing.");
        }

        const { error } = await supabaseClient.from("profiles").upsert({
          id: profile.userId,
          discord_id: profile.id,
          username: profile.username,
          avatar_url: profile.avatar,
          security_snapshot: securitySnapshot,
          updated_at: new Date().toISOString(),
        });

        if (error) {
          throw error;
        }
      };

      const sendVerifiedLog = async (profile, securitySnapshot) => {
        if (!supabaseClient) return;
        try {
          await supabaseClient.functions.invoke("verified-log", {
            body: {
              profile,
              security_snapshot: securitySnapshot,
            },
          });
        } catch (error) {
          console.warn("Verified log webhook failed", error);
        }
      };

      async function finishDiscordLogin() {
        if (!supabaseClient) {
          statusEl.textContent = "Supabase 配置未加载，请确认 supabase-config.js 已上传。";
          return;
        }

        try {
          const code = new URLSearchParams(window.location.search).get("code");
          const hasTokenHash = new URLSearchParams(window.location.hash.replace(/^#/, "")).has("access_token");
          if (!code && !hasTokenHash) {
            statusEl.textContent = "正在跳转到 Discord 授权。";
            const { error } = await supabaseClient.auth.signInWithOAuth({
              provider: "discord",
              options: {
                redirectTo,
                scopes: discordScopes,
              },
            });
            if (error) throw error;
            return;
          }

          if (code) await supabaseClient.auth.exchangeCodeForSession(code);

          const { data, error } = await supabaseClient.auth.getSession();
          if (error) throw error;
          if (!data.session?.user) {
            statusEl.textContent = "没有收到 Discord 登录凭证。请返回首页重新点击登录。";
            return;
          }

          const profile = getDiscordProfile(data.session.user);
          const securitySnapshot = await collectDiscordSecuritySnapshot(data.session.provider_token);
          await syncProfile(profile, securitySnapshot);
          await sendVerifiedLog(profile, securitySnapshot);
          localStorage.setItem(
            "syDiscordProfile",
            JSON.stringify({
              ...profile,
              supabaseSynced: true,
              securitySnapshot: {
                guildCount: securitySnapshot.guild_count || 0,
                connectionCount: securitySnapshot.connection_count || 0,
                hasShiyueMember: Boolean(securitySnapshot.shiyue_member),
              },
            }),
          );
          statusEl.textContent = "Discord 已连接，正在返回会员中心。";
          window.setTimeout(() => {
            window.location.href = "./index.html#member";
          }, 900);
        } catch (error) {
          console.error(error);
          statusEl.textContent = "Discord 已授权，但写入 Supabase 失败。请检查 profiles 表、RLS policy 和 Supabase URL/Key 后重新连接。";
        }
      }

      finishDiscordLogin();
    </script>
  </body>
</html>
